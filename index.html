    const KEY = 'sunday-reviews.password';
    const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

    async function unlock(password) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: bytes(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const page = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAYLOAD.iv) }, key, bytes(PAYLOAD.data));
      return new TextDecoder().decode(page);
    }

    function show(html) {
      document.open();
      document.write(html);
      document.close();
    }

    async function attempt(password, remembered) {
      document.getElementById('go').disabled = true;
      try {
        const html = await unlock(password);
        try { localStorage.setItem(KEY, password); } catch (e) {}
        show(html);
      } catch (e) {
        try { localStorage.removeItem(KEY); } catch (e2) {}
        document.getElementById('error').textContent = remembered ? '' : 'Złe hasło.';
        document.getElementById('go').disabled = false;
      }
    }

    document.getElementById('unlock').addEventListener('submit', (event) => {
      event.preventDefault();
      attempt(document.getElementById('password').value, false);
    });

    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved) attempt(saved, true);
